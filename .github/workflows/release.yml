name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 要发布的 Git tag（必须与 version 匹配）
        required: true
        type: string
      version:
        description: 镜像版本（SemVer，不带 v，例如 0.1.0）
        required: true
        type: string
      publish_latest:
        description: 同时更新 latest（仅稳定版本）
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - id: inputs
        name: Validate release inputs
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          numeric='0|[1-9][0-9]*'
          prerelease='0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*'
          semver_pattern="^(${numeric})\.(${numeric})\.(${numeric})(-(${prerelease})(\.(${prerelease}))*)?$"

          if [[ ! "$VERSION" =~ $semver_pattern ]]; then
            echo "version must be SemVer without a leading v or build metadata" >&2
            exit 1
          fi

          if [[ "$SOURCE_REF" != "v$VERSION" ]]; then
            echo "source_ref must be v$VERSION" >&2
            exit 1
          fi

          if [[ "$PUBLISH_LATEST" == "true" && "$VERSION" == *-* ]]; then
            echo "latest cannot point to a prerelease version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.source_ref }}
      - id: source
        name: Resolve annotated tag
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          tag_ref="refs/tags/$SOURCE_REF"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "source_ref must identify an annotated tag" >&2
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$tag_ref")"
          if [[ "$source_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "checked out commit does not match source_ref" >&2
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  images:
    name: publish-${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

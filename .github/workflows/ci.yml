name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"
  UV_PYTHON: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"

jobs:
  check:
    name: canonical-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: make setup
      - name: Run the same check used locally
        run: make check

  migration-check:
    name: migration-up-down-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run --no-project python scripts/workspace.py setup backend
      - name: Upgrade, downgrade one revision, and upgrade again
        env:
          WORKSPACE107_DATABASE_URL: sqlite+aiosqlite:///./var/ci-migration.db
        run: |
          uv run --no-project python scripts/workspace.py migrate
          uv run --no-project python scripts/workspace.py migrate-down
          uv run --no-project python scripts/workspace.py migrate

  postgres-behavior:
    name: postgres-migration-and-owner-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workspace107_ci
          POSTGRES_USER: workspace107
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace107 -d workspace107_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run PostgreSQL migration and owner race evidence
        env:
          WORKSPACE107_TEST_POSTGRESQL_URL: postgresql+asyncpg://workspace107:ci-throwaway-password@127.0.0.1:5432/workspace107_ci
        run: |
          uv run --no-project python scripts/workspace.py setup backend
          test -n "$WORKSPACE107_TEST_POSTGRESQL_URL"
          cd backend
          uv run pytest -q tests/integration/postgres/test_user_group_postgres.py tests/integration/postgres/test_scoped_config_postgres.py

  windows-check:
    name: windows-canonical-check-and-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Exercise the Make-free Windows entry point
        run: uv run --no-project python scripts/workspace.py setup
      - name: Run the full check, including scheduler and storage Windows tests
        run: uv run --no-project python scripts/workspace.py check
      - name: Exercise an actual mock Run over HTTP
        run: uv run --no-project python scripts/workspace.py smoke

  docker-build:
    name: compose-build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-throwaway-password
      WORKSPACE107_SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --project-directory . --file deploy/compose.yaml build
      - run: docker compose --project-directory . --file deploy/compose.yaml up -d --wait
      - name: Verify database, proxy, catalog seed, and frontend
        run: |
          curl -fsS http://127.0.0.1:8107/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8107/api/v1/catalog/compute-plans -H 'X-User: ci' | grep -q 'cpu-quick'
          curl -fsS http://127.0.0.1:8107/ | grep -q '<div id="root">'
      - name: Print logs on failure
        if: failure()
        run: docker compose --project-directory . --file deploy/compose.yaml logs --no-color
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --project-directory . --file deploy/compose.yaml down -v

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"
  UV_PYTHON: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"
  TOKEI_VERSION: "14.0.0"

jobs:
  check:
    name: canonical-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cargo
          cargo install --locked --version "${TOKEI_VERSION}" tokei
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: make setup
      - name: Run the same check used locally
        run: make check

  docker-build:
    name: compose-build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-throwaway-password
      WORKSPACE107_SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --project-directory . --file deploy/compose.yaml build
      - run: docker compose --project-directory . --file deploy/compose.yaml up -d --wait
      - name: Verify database, proxy, catalog seed, and frontend
        run: |
          curl -fsS http://127.0.0.1:8107/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8107/api/v1/catalog/compute-plans -H 'X-User: ci' | grep -q 'cpu-quick'
          curl -fsS http://127.0.0.1:8107/ | grep -q '<div id="root">'
      - name: Print logs on failure
        if: failure()
        run: docker compose --project-directory . --file deploy/compose.yaml logs --no-color
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --project-directory . --file deploy/compose.yaml down -v

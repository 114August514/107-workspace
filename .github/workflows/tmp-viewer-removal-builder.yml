name: Temporary Viewer Removal Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  UV_VERSION: "0.12.0"
  UV_PYTHON: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-viewer-membership-role
      - name: Restore generated patch from the verified builder artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9477872989/zip > /tmp/viewer-removal.zip
          unzip -o /tmp/viewer-removal.zip -d .
      - name: Apply final review fixes
        shell: python
        run: |
          from pathlib import Path

          migration = Path("backend/migrations/versions/b65d9e27a4c1_remove_viewer_membership_role.py")
          text = migration.read_text(encoding="utf-8")
          text = text.replace(
              "    op.execute(\n        sa.text(\n            \"UPDATE memberships SET role='member', status='removed' \"\n            \"WHERE role='viewer'\"\n        )\n    )",
              "    op.execute(\n        sa.text(\"UPDATE memberships SET role='member', status='removed' WHERE role='viewer'\")\n    )",
          )
          migration.write_text(text, encoding="utf-8")

          tests = Path("backend/tests/integration/identity/test_user_groups.py")
          text = tests.read_text(encoding="utf-8")
          old = '''            json={"role": "viewer"},\n            headers=ALICE,\n        ),\n    )\n\n    assert (transfer.status_code, role_change.status_code) in {(204, 409), (204, 200)}'''
          new = '''            json={"role": "admin"},\n            headers=ALICE,\n        ),\n    )\n\n    assert (transfer.status_code, role_change.status_code) in {(204, 409), (204, 200)}'''
          if old not in text:
              raise RuntimeError("expected concurrency role-change fixture was not found")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify final patch
        run: |
          make setup
          make check
      - name: Commit final patch and remove this temporary workflow
        run: |
          git rm .github/workflows/tmp-viewer-removal-builder.yml
          git add -A
          git config user.name "107 Agent"
          git config user.email "agent@107-workspace"
          git commit -m "refactor(identity): remove Viewer membership role"
          git push origin HEAD:refactor/remove-viewer-membership-role

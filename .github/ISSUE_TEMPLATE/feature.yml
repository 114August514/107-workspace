name: 功能 / 任务
description: 按 GitGuideline.md §4.1 的五要素开一个任务
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        `GitGuideline.md` §4.1：Issue 至少写清楚 **背景 / 目标 / 范围 / 验收条件 / 不做什么**。
        一个 Issue 控制在**半天到三天**内完成，过大就拆。

        术语请用 `DESIGN-final.md` §3.1 的名字（Workspace / Project Version /
        Run Snapshot / Input Binding …），别另造词。

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么现在做这个。对应 DESIGN-final.md 的哪一节 / 哪条能力。
      placeholder: |
        DESIGN-final §2.8 A [Core] 从 Project 发起 Run。
        当前 Run 只能通过 API 直接构造，没有走 Run Configuration 解析。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 一句话说清楚做完之后**用户能做什么**（不是"重构了某个模块"）。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: |
        一条一行，**要能被机器判定**。至少写一条异常路径。
        "用户友好""性能好"不是验收条件。
      placeholder: |
        - Owner 可以从 Project 的确定版本发起 Run
        - Run 创建后 Run Snapshot 不可修改，尝试修改返回 409
        - 引用的 Secret 在目标 Workspace 不存在时，提交前检查拦住并说明缺哪个
        - 非成员访问该 Project 的 Run 返回 403
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 不做什么
      description: |
        **这一项比"做什么"更重要。** 不划边界，范围会在实现中无声膨胀。
        可以直接引用 DESIGN-final 的阶段标记（把 [V1]/[V2] 的部分列进来）。
      placeholder: |
        - 不做 Run 批量创建（DESIGN-final §2.8 E，[V2]）
        - 不做自动重试（[V2]）
        - 不做 Metric 上报（本 Issue 只到 Run 提交为止）
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: 范围（会碰哪些目录）
      description: 顺便说明**不碰**哪些。多人并行时这是避免撞车的依据。
      placeholder: 碰 backend/src/workspace107/application/ 与 api/；不碰 infrastructure/cluster/
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - "P0 - 阻塞级"
        - "P1 - 应在当前实现"
        - "P2 - 可以延后"
    validations:
      required: true

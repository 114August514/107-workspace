[project]
name = "workspace107"
version = "0.1.0"
description = "107 Workspace —— 面向 USTC 107 算力平台的协作式计算工作空间"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pathspec>=0.12,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
107 = "workspace107.cli:main"

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:workspace107.*"]

[tool.coverage.run]
branch = true
source = ["workspace107"]
omit = ["src/workspace107/tools/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "TID"]
ignore = [
  # 本项目的注释、docstring 和面向用户的文案都用中文，
  # 全角标点是正常写法，不是「易混淆字符」。
  "RUF001",
  "RUF002",
  "RUF003",
  # 包内使用相对导入是本项目的既定风格；这里只借 TID 拦截跨层 import（TID251）。
  "TID252",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 领域层不得依赖框架。违反分层的 import 在 CI 中直接失败。
"fastapi".msg = "domain 层不得依赖 Web 框架；请在 api 层使用。"

[tool.ruff.lint.per-file-ignores]
# B008：FastAPI 的 Depends / Query / File 就是靠参数默认值声明的，属于框架惯例。
"src/workspace107/api/**" = ["TID251", "B008"]
"src/workspace107/main.py" = ["TID251"]
"src/workspace107/tools/**" = ["TID251"]
"tests/**" = ["TID251"]

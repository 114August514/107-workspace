name: workspace107

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace107}
      POSTGRES_USER: ${POSTGRES_USER:-workspace107}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-workspace107} -d ${POSTGRES_DB:-workspace107}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./backend
      args:
        WORKSPACE107_SERVICE_UID: ${WORKSPACE107_SERVICE_UID:-10001}
        WORKSPACE107_SERVICE_GID: ${WORKSPACE107_SERVICE_GID:-10001}
        WORKSPACE107_STORAGE_GID: ${WORKSPACE107_STORAGE_GID:-10001}
    image: ${WORKSPACE107_IMAGE_API:-workspace107/api:local}
    restart: unless-stopped
    group_add:
      - ${WORKSPACE107_STORAGE_GID:-10001}
    environment:
      WORKSPACE107_ENV: ${WORKSPACE107_ENV:-local}
      WORKSPACE107_LOG_LEVEL: ${WORKSPACE107_LOG_LEVEL:-INFO}
      WORKSPACE107_LOG_FORMAT: json
      WORKSPACE107_MAX_REQUEST_BYTES: ${WORKSPACE107_MAX_REQUEST_BYTES:-134217728}
      WORKSPACE107_MAX_FILE_BYTES: ${WORKSPACE107_MAX_FILE_BYTES:-33554432}
      WORKSPACE107_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-workspace107}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workspace107}
      WORKSPACE107_STORAGE_ROOT: /var/lib/workspace107/storage
      WORKSPACE107_STORAGE_GID: ${WORKSPACE107_STORAGE_GID:-10001}
      WORKSPACE107_AUTH_MODE: ${WORKSPACE107_AUTH_MODE:-dev}
      WORKSPACE107_SEED_DEMO: ${WORKSPACE107_SEED_DEMO:-false}
      WORKSPACE107_DEMO_PLATFORM_OWNER_USERNAME: ${WORKSPACE107_DEMO_PLATFORM_OWNER_USERNAME:-student}
    volumes:
      - ${WORKSPACE107_STORAGE_MOUNT:-storage-data}:/var/lib/workspace107/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        WORKSPACE107_SERVICE_UID: ${WORKSPACE107_SERVICE_UID:-10001}
        WORKSPACE107_SERVICE_GID: ${WORKSPACE107_SERVICE_GID:-10001}
        WORKSPACE107_STORAGE_GID: ${WORKSPACE107_STORAGE_GID:-10001}
    image: ${WORKSPACE107_IMAGE_API:-workspace107/api:local}
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["python", "-m", "workspace107.worker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import sys; sys.exit(0 if b'workspace107.worker' in Path('/proc/1/cmdline').read_bytes() else 1)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    group_add:
      - ${WORKSPACE107_STORAGE_GID:-10001}
    environment:
      WORKSPACE107_ENV: ${WORKSPACE107_ENV:-local}
      WORKSPACE107_LOG_LEVEL: ${WORKSPACE107_LOG_LEVEL:-INFO}
      WORKSPACE107_LOG_FORMAT: json
      WORKSPACE107_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-workspace107}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workspace107}
      WORKSPACE107_STORAGE_ROOT: /var/lib/workspace107/storage
      WORKSPACE107_STORAGE_GID: ${WORKSPACE107_STORAGE_GID:-10001}
      WORKSPACE107_SHARED_GID: ${WORKSPACE107_SHARED_GID:-10001}
      WORKSPACE107_SCHEDULER: ${WORKSPACE107_SCHEDULER:-mock}
      WORKSPACE107_SLURM_API_BASE_URL: ${WORKSPACE107_SLURM_API_BASE_URL:-}
      WORKSPACE107_SLURM_API_USER: ${WORKSPACE107_SLURM_API_USER:-}
      WORKSPACE107_SLURM_JWT: ${WORKSPACE107_SLURM_JWT:-}
      WORKSPACE107_SLURM_TARGET_CLUSTER_ID: ${WORKSPACE107_SLURM_TARGET_CLUSTER_ID:-}
      WORKSPACE107_SLURM_API_VERSION: ${WORKSPACE107_SLURM_API_VERSION:-}
      WORKSPACE107_SLURM_API_SCHEMA_PROFILE: ${WORKSPACE107_SLURM_API_SCHEMA_PROFILE:-}
      WORKSPACE107_SLURM_SUBMIT_PATH: ${WORKSPACE107_SLURM_SUBMIT_PATH:-}
      WORKSPACE107_SLURM_JOB_PATH_TEMPLATE: ${WORKSPACE107_SLURM_JOB_PATH_TEMPLATE:-}
      WORKSPACE107_SLURM_JOBS_PATH: ${WORKSPACE107_SLURM_JOBS_PATH:-}
      WORKSPACE107_SLURM_CANCEL_PATH_TEMPLATE: ${WORKSPACE107_SLURM_CANCEL_PATH_TEMPLATE:-}
      WORKSPACE107_SLURM_CORRELATION_FIELD: ${WORKSPACE107_SLURM_CORRELATION_FIELD:-}
      WORKSPACE107_SLURM_CORRELATION_QUERY_PARAMETER: >-
        ${WORKSPACE107_SLURM_CORRELATION_QUERY_PARAMETER:-}
      WORKSPACE107_SLURM_CORRELATION_QUERY_COMPLETE: >-
        ${WORKSPACE107_SLURM_CORRELATION_QUERY_COMPLETE:-false}
      WORKSPACE107_SLURM_CORRELATION_MAX_BYTES: >-
        ${WORKSPACE107_SLURM_CORRELATION_MAX_BYTES:-0}
      WORKSPACE107_SLURM_RUNTIME_MODE: ${WORKSPACE107_SLURM_RUNTIME_MODE:-native}
      WORKSPACE107_SLURM_TIMEOUT_SECONDS: ${WORKSPACE107_SLURM_TIMEOUT_SECONDS:-20}
      WORKSPACE107_WORKER_POLL_SECONDS: ${WORKSPACE107_WORKER_POLL_SECONDS:-1.0}
      WORKSPACE107_WORKER_IDLE_SECONDS: ${WORKSPACE107_WORKER_IDLE_SECONDS:-0.5}
      WORKSPACE107_SKIP_BOOTSTRAP: "true"
    volumes:
      - ${WORKSPACE107_STORAGE_MOUNT:-storage-data}:/var/lib/workspace107/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    image: ${WORKSPACE107_IMAGE_WEB:-workspace107/web:local}
    restart: unless-stopped
    ports:
      - "${WORKSPACE107_HTTP_PORT:-8107}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
